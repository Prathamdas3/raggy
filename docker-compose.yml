version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: my_postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    # volumes:
    #   - postgres_data:/var/lib/postgresql/data
    # networks:
    #   - app_network

  redis:
    image: redis:7
    container_name: my_redis
    restart: always
    ports:
      - "6379:6379"
    # volumes:
    #   - redis_data:/data
    # networks:
    #   - app_network

  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    # volumes:
    #   - ./qdrant_storage:/qdrant/storage
# volumes:
#   postgres_data:
#   redis_data:

# networks:
#   app_network:
#     driver: bridge
